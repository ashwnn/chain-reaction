  </style>
  <rect x="0.00" y="0.00" width="720.00" height="320.00" fill="#FFFFFF" stroke="none" stroke-width="0.0"/>
  <text x="360.00" y="22.00" text-anchor="middle" dominant-baseline="middle" class="title">Wilcoxon Signed-Rank Test</text>
  <text x="360.00" y="38.00" text-anchor="middle" dominant-baseline="middle" class="subtitle">H₀: median SC = 0.80</text>
  <rect x="76.00" y="72.00" width="608.00" height="180.00" fill="#FBFCFD" stroke="#D7DCE2" stroke-width="1.0"/>
  <rect x="76.00" y="72.00" width="608.00" height="180.00" rx="8.00" fill="#F4F6F8" stroke="#D7DCE2" stroke-width="1.0"/>
  <rect x="76.00" y="72.00" width="6.00" height="180.00" fill="#0072B2" stroke="none" stroke-width="0.0"/>
  <text x="175.50" y="140.40" text-anchor="middle" dominant-baseline="middle" class="stat-value">5</text>
  <text x="175.50" y="171.00" text-anchor="middle" dominant-baseline="middle" class="stat-label">N (non-zero diffs)</text>
  <text x="318.50" y="140.40" text-anchor="middle" dominant-baseline="middle" class="stat-value">0.0</text>
