# llm-secret-template.yaml — template for the LLM API key Kubernetes Secret.
#
# SECURITY NOTE: This file documents the Secret structure. It does NOT contain
# real credentials. Secrets must NEVER be committed to source control with
# actual credential values.
#
# Render this template using kubectl --dry-run with --from-literal to
# produce a local Secret manifest without touching the API server:
#
#   # Replace LLM_API_KEY with your actual key
#   kubectl create secret generic chain-reaction-llm \
#     --from-literal=LLM_API_KEY=<your-key> \
#     --namespace=chain-reaction \
#     --dry-run=client \
#     -o yaml > deploy/llm-secret.yaml
#
# Then apply:
#   kubectl apply -f deploy/llm-secret.yaml
#
# Supported secret keys:
#   generic   → LLM_API_KEY
#   openai    → OPENAI_API_KEY
#   anthropic → ANTHROPIC_API_KEY
#   groq      → GROQ_API_KEY
#
# The run-validate-in-cluster.sh script creates this Secret automatically
# from the local environment variable matching the selected --llm-provider,
# with LLM_API_KEY accepted as a generic fallback for self-hosted endpoints.
# This template is for documentation and manual deployment when scripting is
# not used.
#
apiVersion: v1
kind: Secret
metadata:
  name: chain-reaction-llm
  namespace: chain-reaction
  labels:
    app.kubernetes.io/name: chain-reaction
    app.kubernetes.io/part-of: chain-reaction
    heritage: chain-reaction
    chain-reaction.app/component: credentials
type: Opaque
#data:
#  # Render with: kubectl create secret generic chain-reaction-llm --from-literal=LLM_API_KEY=<key>
#  # The --dry-run=client -o yaml pattern above avoids storing the key in shell history.
#  LLM_API_KEY: REPLACE_WITH_ACTUAL_KEY
stringData:
  # Generic placeholder — works for self-hosted/OpenAI-compatible endpoints.
  # Provider-specific keys (OPENAI_API_KEY, ANTHROPIC_API_KEY, GROQ_API_KEY)
  # are also accepted when preferred.
  # DO NOT commit real credentials.
  LLM_API_KEY: "REPLACE_ME"
